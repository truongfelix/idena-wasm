name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.build }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: linux-x64
            os: ubuntu-24.04
            artifact_name: libidena_wasm_linux_amd64.a
            target: ''
          - build: linux-arm64
            os: ubuntu-24.04-arm
            artifact_name: libidena_wasm_linux_aarch64.a
            target: ''
          - build: macos-x64
            os: macos-15-intel
            artifact_name: libidena_wasm_darwin_amd64.a
            target: x86_64-apple-darwin
          - build: macos-arm64
            os: macos-15
            artifact_name: libidena_wasm_darwin_arm64.a
            target: aarch64-apple-darwin
          - build: windows-x64
            os: windows-2025
            artifact_name: libidena_wasm_windows_amd64.a
            target: x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.97.0
          targets: ${{ matrix.target }}
          components: llvm-tools

      - name: Install Windows GNU linker
        if: matrix.os == 'windows-2025'
        run: choco install -y mingw

      - name: Build
        env:
          MATRIX_TARGET: ${{ matrix.target }}
          MATRIX_ARTIFACT_NAME: ${{ matrix.artifact_name }}
        run: |
          scripts/build-binding-lib.sh "${MATRIX_TARGET}" "${MATRIX_ARTIFACT_NAME}"
          openssl dgst -sha256 -r "${MATRIX_ARTIFACT_NAME}" > "${MATRIX_ARTIFACT_NAME}.sha256"
          cat "${MATRIX_ARTIFACT_NAME}.sha256"

      # The Go binding links the library as built here: Go must accept it (1.26.11 and later refuse LTO sections) and
      # the binding's library tests must pass with it, the only library in the binding's lib folder.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.11
          cache: false

      # The binding's Go side at a fixed commit (scripts/check-with-binding.sh).
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: truongfelix/idena-wasm-binding
          ref: 8045f385d40031aeed82673c8c1c7434357c9e60
          path: binding

      - name: Check with the Go binding
        env:
          MATRIX_ARTIFACT_NAME: ${{ matrix.artifact_name }}
        run: scripts/check-with-binding.sh "${MATRIX_ARTIFACT_NAME}" binding

      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.build }}
          path: |
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
