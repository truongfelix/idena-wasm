name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

defaults:
  run:
    shell: bash
jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - name: Validate tag
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Unsupported release tag: ${tag}" >&2
            exit 1
          fi

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --all-targets --all-features

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit
        run: cargo audit

  # Each platform builds and checks its library; publish below creates the release only once all five passed.
  release:
    needs: preflight
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: linux-x64
            os: ubuntu-24.04
            artifact_name: 'libidena_wasm_linux_amd64.a'
            target: ''
          - build: linux-arm64
            os: ubuntu-24.04-arm
            artifact_name: 'libidena_wasm_linux_aarch64.a'
            target: ''
          - build: macos-x64
            os: macos-15-intel
            artifact_name: 'libidena_wasm_darwin_amd64.a'
            target: x86_64-apple-darwin
          - build: macos-arm64
            os: macos-15
            artifact_name: 'libidena_wasm_darwin_arm64.a'
            target: aarch64-apple-darwin
          - build: windows-x64
            os: windows-2025
            artifact_name: 'libidena_wasm_windows_amd64.a'
            target: x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.97.0
          targets: ${{ matrix.target }}
          components: llvm-tools

      - name: Install Windows GNU linker
        if: matrix.os == 'windows-2025'
        run: choco install -y mingw --version=16.1.0

      # The same build as build.yml (scripts/build-binding-lib.sh: fixed Cargo folder, no LTO sections).
      - name: Build
        env:
          MATRIX_ARTIFACT_NAME: ${{ matrix.artifact_name }}
          MATRIX_TARGET: ${{ matrix.target }}
        run: |
          asset_name="${MATRIX_ARTIFACT_NAME}"
          scripts/build-binding-lib.sh "${MATRIX_TARGET}" "${asset_name}"
          openssl dgst -sha256 -r "${asset_name}" > "${asset_name}.sha256"
          echo "ASSET_NAME=${asset_name}" >> "$GITHUB_ENV"

      # Go 1.26.11 links the library and the Go binding's library tests pass with it.
      - uses: ./.github/actions/check-with-binding
        with:
          library: ${{ env.ASSET_NAME }}

      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.build }}
          path: |
            ${{ env.ASSET_NAME }}
            ${{ env.ASSET_NAME }}.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    needs: release
    name: Publish the release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Check the five libraries
        run: |
          ls -l dist
          [[ "$(ls dist/*.a | wc -l)" == 5 && "$(ls dist/*.a.sha256 | wc -l)" == 5 ]]

      - name: Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            dist/*.a
            dist/*.a.sha256
