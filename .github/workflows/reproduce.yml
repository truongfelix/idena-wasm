name: Reproduce the published libraries

# Started by hand: rebuilds b686ed8, the commit the libraries in idena-wasm-binding were built from (lib/SHA256SUMS,
# ubiubi18/idena-wasm run 35934763212 of "Build"), with that run's build steps (without its cache, which does not
# change the bytes), and compares each library with the published checksum. It needs ubiubi18/wasmer, which b686ed8
# fetches Wasmer from.
on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # The runner's default Cargo folder, as in that run: the libraries hold the dependencies' source paths under it.
  reproduce:
    name: ${{ matrix.build }} from b686ed8 (published library)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: linux-x64
            os: ubuntu-24.04
            target: ''
            sha256: 069a76fa8eb121ecf120ead2a7a7e2e40cf6ceb3d983dd37d0f475a9675d9eac
          - build: linux-arm64
            os: ubuntu-24.04-arm
            target: ''
            sha256: c9a57082ddba1341a24b99f92ed818b0b51ee98ae00c049ba8a384d18957001e
          - build: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            sha256: 8991e4d8d1ab18d89c962903405a0f510b85305506eddef7a463318099416ca3
          - build: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            sha256: d8d4f1bf2593840f5a2092b6967c16a5d3bd1a860cddbd6559a14e062d641eaf
          - build: windows-x64
            os: windows-2025
            target: x86_64-pc-windows-gnu
            sha256: 8da1eb88a045fbc2cd4448a89acb11d7ce16568768fe2d71f461644c82b5c3df
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: b686ed84d26b43dfa74ea12a0d3af1b120a50598
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.97.0
          targets: ${{ matrix.target }}

      - name: Install Windows GNU linker
        if: matrix.os == 'windows-2025'
        run: choco install -y mingw --version=16.1.0

      - name: Build and compare
        env:
          MATRIX_TARGET: ${{ matrix.target }}
          EXPECTED: ${{ matrix.sha256 }}
        run: |
          if [[ -n "${MATRIX_TARGET}" ]]; then
            cargo build --locked --release --all-features --target "${MATRIX_TARGET}"
            output="target/${MATRIX_TARGET}/release/libidena_wasm.a"
          else
            cargo build --locked --release --all-features
            output="target/release/libidena_wasm.a"
          fi
          actual="$(openssl dgst -sha256 -r "${output}" | awk '{print $1}')"
          echo "built ${actual}, published ${EXPECTED}"
          [[ "${actual}" == "${EXPECTED}" ]]
